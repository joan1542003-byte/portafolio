services:
  - type: web
    name: portafolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: https://portafolio-ebon-chi-65.vercel.app,https://portafolio-joan.vercel.app
